<div class="categories-page">


  <!-- =====================================================
       PAGE HEADER
  ====================================================== -->

  <div class="page-header">

    <div>

      <p>
        Manage your menu categories
      </p>

    </div>


    <button
      type="button"
      class="add-btn"
      (click)="addCategory()"
    >

      <i class="bi bi-plus-circle"></i>

      Add Category

    </button>

  </div>



  <!-- =====================================================
       SEARCH
  ====================================================== -->

  <div class="toolbar">

    <div class="search-box">

      <i class="bi bi-search"></i>

      <input
        type="text"
        [(ngModel)]="searchText"
        placeholder="Search category..."
      >

    </div>

  </div>



  <!-- =====================================================
       LOADING
  ====================================================== -->

  <div
    class="loading"
    *ngIf="loading"
  >

    <i class="bi bi-arrow-repeat"></i>

    Loading categories...

  </div>



  <!-- =====================================================
       CATEGORY GRID
  ====================================================== -->

  <div
    class="category-grid"
    *ngIf="!loading"
  >

    <div
      class="category-card"
      *ngFor="let category of filteredCategories"
    >


      <!-- =================================================
           CATEGORY IMAGE
      ================================================== -->

      <div class="category-image">


        <!-- Uploaded Image -->

        <img
          *ngIf="category.image"
          [src]="getImageUrl(category.image)"
          [alt]="category.name"
        >


        <!-- Default Image -->

        <div
          class="default-category-image"
          *ngIf="!category.image"
        >

          <i class="bi bi-image"></i>

        </div>

      </div>



      <!-- =================================================
           CATEGORY INFORMATION
      ================================================== -->

      <div class="category-info">

        <h3>

          {{ category.name }}

        </h3>

        <p>

          {{ category.items }} Items

        </p>

      </div>



      <!-- =================================================
           STATUS
      ================================================== -->

      <span
        class="status"
        [class.active]="category.status === 'Active'"
        [class.inactive]="category.status === 'Inactive'"
      >

        {{ category.status }}

      </span>



      <!-- =================================================
           ACTION BUTTONS
      ================================================== -->

      <div class="category-actions">


        <!-- EDIT -->

        <button
          type="button"
          class="edit-btn"
          (click)="editCategory(category)"
        >

          <i class="bi bi-pencil"></i>

          Edit

        </button>



        <!-- DELETE -->

        <button
          type="button"
          class="delete-btn"
          (click)="deleteCategory(category)"
        >

          <i class="bi bi-trash"></i>

          Delete

        </button>

      </div>


    </div>

  </div>



  <!-- =====================================================
       NO RESULTS
  ====================================================== -->

  <div
    class="no-results"
    *ngIf="
      !loading &&
      filteredCategories.length === 0
    "
  >

    <i class="bi bi-search"></i>

    <h3>

      No categories found

    </h3>

    <p>

      Try searching with a different category name.

    </p>

  </div>



  <!-- =====================================================
       ADD / EDIT MODAL
  ====================================================== -->

  <div
    class="modal-overlay"
    *ngIf="showModal"
    (click)="closeModal()"
  >


    <!-- =================================================
         MODAL BOX
    ================================================== -->

    <div
      class="category-modal"
      (click)="$event.stopPropagation()"
    >


      <!-- =================================================
           MODAL HEADER
      ================================================== -->

      <div class="modal-header">

        <h2>

          {{
            isEditMode
              ? 'Edit Category'
              : 'Add Category'
          }}

        </h2>


        <button
          type="button"
          class="close-btn"
          (click)="closeModal()"
        >

          <i class="bi bi-x-lg"></i>

        </button>

      </div>



      <!-- =================================================
           MODAL BODY
      ================================================== -->

      <div class="modal-body">


        <!-- =================================================
             CATEGORY NAME
        ================================================== -->

        <div class="form-group">

          <label>
            Category Name
          </label>


          <input
            type="text"
            [(ngModel)]="selectedCategory.name"
            placeholder="Enter category name"
          >

        </div>



        <!-- =================================================
             CATEGORY IMAGE
        ================================================== -->

        <div class="form-group">

          <label>
            Category Image
          </label>


          <!-- IMAGE PREVIEW -->

          <div
            class="image-preview"
            *ngIf="selectedCategory.image"
          >

            <img
              [src]="
                selectedCategory.image.startsWith('data:')
                  ? selectedCategory.image
                  : getImageUrl(selectedCategory.image)
              "
              [alt]="selectedCategory.name"
            >


            <button
              type="button"
              class="remove-image-btn"
              (click)="removeImage()"
            >

              <i class="bi bi-trash"></i>

              Remove

            </button>

          </div>



          <!-- UPLOAD BOX -->

          <label
            class="upload-box"
            *ngIf="!selectedCategory.image"
          >

            <i class="bi bi-cloud-arrow-up"></i>


            <span>
              Click to upload image
            </span>


            <small>
              PNG, JPG, JPEG
            </small>


            <input
              type="file"
              accept="image/png,image/jpeg,image/jpg,image/webp"
              (change)="onImageSelected($event)"
              hidden
            >

          </label>

        </div>



        <!-- =================================================
             NUMBER OF ITEMS
        ================================================== -->

        <div class="form-group">

          <label>
            Number of Items
          </label>


          <input
            type="number"
            min="0"
            [(ngModel)]="selectedCategory.items"
            placeholder="0"
          >

        </div>



        <!-- =================================================
             STATUS
        ================================================== -->

        <div class="form-group">

          <label>
            Status
          </label>


          <select
            [(ngModel)]="selectedCategory.status"
          >

            <option value="Active">
              Active
            </option>


            <option value="Inactive">
              Inactive
            </option>

          </select>

        </div>

      </div>



      <!-- =================================================
           MODAL FOOTER
      ================================================== -->

      <div class="modal-footer">


        <button
          type="button"
          class="cancel-btn"
          (click)="closeModal()"
        >

          Cancel

        </button>


        <button
          type="button"
          class="save-btn"
          [disabled]="saving"
          (click)="saveCategory()"
        >

          <i
            class="bi"
            [class.bi-check-circle]="!isEditMode"
            [class.bi-pencil]="isEditMode"
          ></i>


          {{
            saving
              ? 'Saving...'
              : isEditMode
                ? 'Update Category'
                : 'Add Category'
          }}

        </button>

      </div>


    </div>

  </div>


</div>
