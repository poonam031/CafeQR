<div class="admin-menu-container">

  <!-- =====================================
       HEADER
  ====================================== -->

  <div class="page-header">

    <div>

      <p>
        Manage your restaurant menu items.
      </p>

    </div>


    <button
      class="add-item-btn"
      (click)="addItem()"
    >

      <i class="bi bi-plus-circle"></i>

      Add Item

    </button>

  </div>


  <!-- =====================================
       SUCCESS
  ====================================== -->

  <div
    class="alert success"
    *ngIf="successMessage"
  >

    {{ successMessage }}

  </div>


  <!-- =====================================
       ERROR
  ====================================== -->

  <div
    class="alert error"
    *ngIf="errorMessage"
  >

    {{ errorMessage }}

  </div>


  <!-- =====================================
       SEARCH
  ====================================== -->

  <div class="filter-area">

    <div class="search-box">

      <i class="bi bi-search"></i>

      <input
        type="text"
        placeholder="Search menu item..."
        [(ngModel)]="searchText"
        (input)="applyFilters()"
      />

    </div>


    <select
      class="category-select"
      [(ngModel)]="selectedCategory"
      (change)="applyFilters()"
    >

      <option
        *ngFor="let category of categories"
        [value]="category"
      >

        {{ category === 'All'
            ? 'All Categories'
            : category }}

      </option>

    </select>

  </div>


  <!-- =====================================
       LOADING
  ====================================== -->

  <div
    class="loading"
    *ngIf="loading"
  >

    Loading menu...

  </div>


  <!-- =====================================
       MENU GRID
  ====================================== -->

  <div
    class="menu-grid"
    *ngIf="!loading"
  >

    <div
      class="menu-card"
      *ngFor="
        let item of filteredItems
      "
    >

      <!-- IMAGE -->

      <div class="image-container">

        <img
        [src]="getImageUrl(item.image)"
        [alt]="item.name"
      />


        <!-- VEG -->

        <span
          class="veg-badge"
          *ngIf="item.isVeg"
        >

          Veg

        </span>


        <span
          class="nonveg-badge"
          *ngIf="!item.isVeg"
        >

          Non-Veg

        </span>

      </div>


      <!-- CONTENT -->

      <div class="card-content">

        <div class="title-row">

          <h3>
            {{ item.name }}
          </h3>

        </div>


        <p class="description">

          {{ item.description }}

        </p>


        <div class="price">

          ₹{{ item.price }}

        </div>


        <!-- AVAILABILITY -->

        <button
          class="availability"
          [class.available]="
            item.isAvailable
          "
          [class.out-of-stock]="
            !item.isAvailable
          "
          (click)="
            toggleAvailability(item)
          "
        >

          <span class="status-dot"></span>

          {{
            item.isAvailable
              ? 'Available'
              : 'Out of Stock'
          }}

        </button>


        <!-- ACTIONS -->

        <div class="actions">

          <button
            class="edit-btn"
            (click)="editItem(item)"
          >

            <i class="bi bi-pencil"></i>

            Edit

          </button>


          <button
            class="delete-btn"
            (click)="deleteItem(item)"
          >

            <i class="bi bi-trash"></i>

            Delete

          </button>

        </div>

      </div>

    </div>


    <!-- =================================
         EMPTY
    ================================== -->

    <div
      class="empty-state"
      *ngIf="
        filteredItems.length === 0
      "
    >

      <i class="bi bi-inbox"></i>

      <h3>
        No menu items found
      </h3>

      <p>
        Add your first menu item.
      </p>

      <button
        class="add-item-btn"
        (click)="addItem()"
      >

        Add Item

      </button>

    </div>

  </div>

</div>


<!-- =====================================
     ADD / EDIT MODAL
====================================== -->

<div
  class="modal-overlay"
  *ngIf="showModal"
  (click)="closeModal()"
>

  <div
    class="menu-modal"
    (click)="$event.stopPropagation()"
  >

    <!-- MODAL HEADER -->

    <div class="modal-header">

      <div>

        <h2>

          {{
            isEditMode
              ? 'Edit Menu Item'
              : 'Add Menu Item'
          }}

        </h2>

        <p>
          Enter the menu item details.
        </p>

      </div>


      <button
        class="close-btn"
        (click)="closeModal()"
      >

        ×

      </button>

    </div>


    <!-- FORM -->

    <form
      (ngSubmit)="saveItem()"
    >

      <!-- IMAGE -->

      <div class="image-upload">

        <div
          class="image-preview"
          *ngIf="menuForm.image"
        >

          <img
            [src]="menuForm.image"
            alt="Preview"
          />

        </div>


        <label
          class="upload-label"
        >

          <i class="bi bi-cloud-arrow-up"></i>

          <span>
            Upload Food Image
          </span>

          <small>
            JPG, PNG or WEBP
          </small>

          <input
            type="file"
            accept="image/*"
            (change)="
              onImageChange($event)
            "
          />

        </label>

      </div>


      <!-- NAME -->

      <div class="form-group">

        <label>
          Item Name
        </label>

        <input
          type="text"
          name="name"
          [(ngModel)]="menuForm.name"
          placeholder="e.g. Margherita Pizza"
        />

      </div>


      <!-- CATEGORY -->

      <div class="form-row">

        <div class="form-group">

          <label>
            Category
          </label>

          <select
            name="category"
            [(ngModel)]="menuForm.category"
          >

            <option
              *ngFor="
                let category of categories
              "
              [value]="category"
              [disabled]="
                category === 'All'
              "
            >

              {{ category }}

            </option>

          </select>

        </div>


        <!-- PRICE -->

        <div class="form-group">

          <label>
            Price
          </label>

          <input
            type="number"
            name="price"
            [(ngModel)]="menuForm.price"
            min="1"
            placeholder="180"
          />

        </div>

      </div>


      <!-- DESCRIPTION -->

      <div class="form-group">

        <label>
          Description
        </label>

        <textarea
          name="description"
          [(ngModel)]="menuForm.description"
          rows="3"
          placeholder="Describe the food item..."
        ></textarea>

      </div>


      <!-- OPTIONS -->

      <div class="options-row">

        <label class="checkbox-label">

          <input
            type="checkbox"
            name="isVeg"
            [(ngModel)]="menuForm.isVeg"
          />

          <span>
            Vegetarian
          </span>

        </label>


        <label class="checkbox-label">

          <input
            type="checkbox"
            name="isAvailable"
            [(ngModel)]="
              menuForm.isAvailable
            "
          />

          <span>
            Available
          </span>

        </label>

      </div>


      <!-- BUTTONS -->

      <div class="modal-actions">

        <button
          type="button"
          class="cancel-btn"
          (click)="closeModal()"
        >

          Cancel

        </button>


        <button
          type="submit"
          class="save-btn"
          [disabled]="saving"
        >

          {{
            saving
              ? 'Saving...'
              : (
                  isEditMode
                    ? 'Update Item'
                    : 'Add Item'
                )
          }}

        </button>

      </div>

    </form>

  </div>

</div>
