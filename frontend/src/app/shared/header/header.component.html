<header class="top-header">

 <!-- =========================================
     MENU BUTTON
========================================== -->

<button
    class="menu-btn"
    type="button"
    (click)="toggleSidebar()"
>

    <i class="bi bi-list"></i>

</button>


<!-- =========================================
     TITLE
========================================== -->

<h3 class="header-title">

    {{ title }}

</h3>


<!-- =========================================
     NOTIFICATION BUTTON
========================================== -->

<button
    class="notification"
    type="button"
    (click)="toggleNotifications()"
    [class.has-notification]="notifications > 0"
    aria-label="Notifications"
>

    <i class="bi bi-bell-fill"></i>


    <span
        class="notification-count"
        *ngIf="notifications > 0"
    >

        {{ notifications }}

    </span>

</button>


<!-- =========================================
     NOTIFICATION PANEL
========================================== -->

<div
    class="notification-panel"
    *ngIf="showNotifications"
>


    <!-- HEADER -->

    <div class="notification-header">

        <div class="notification-title">

            <i class="bi bi-bell-fill"></i>

            <strong>
                Notifications
            </strong>

        </div>


        <button
            type="button"
            class="clear-btn"
            (click)="clearNotifications()"
        >

            Clear

        </button>

    </div>


    <!-- =====================================
         ADD REMINDER
    ====================================== -->

    <button
        type="button"
        class="add-reminder-btn"
        (click)="openReminderForm()"
    >

        <i class="bi bi-calendar-plus"></i>


        <span>
            Add Reminder
        </span>


        <i class="bi bi-chevron-right"></i>

    </button>


    <!-- =====================================
         NEW ORDER
    ====================================== -->

    <div
        class="notification-item"
        *ngIf="notifications > 0"
    >

        <div class="notification-icon">

            <i class="bi bi-receipt"></i>

        </div>


        <div class="notification-text">

            <strong>
                New Order
            </strong>


            <p>

                You have
                {{ notifications }}
                new order notification{{ notifications > 1 ? 's' : '' }}.

            </p>

        </div>

    </div>


    <!-- =====================================
         NO NOTIFICATIONS
    ====================================== -->

    <div
        class="no-notification"
        *ngIf="notifications === 0"
    >

        <i class="bi bi-bell-slash"></i>


        <span>
            No new notifications
        </span>

    </div>

</div>


<!-- =========================================
     REMINDER MODAL OVERLAY
========================================== -->

<div
    class="reminder-overlay"
    *ngIf="showReminderForm"
    (click)="closeReminderForm()"
>


    <!-- =====================================
         REMINDER MODAL
    ====================================== -->

    <div
        class="reminder-modal"
        (click)="$event.stopPropagation()"
    >


        <!-- MODAL HEADER -->

        <div class="reminder-modal-header">

            <div>

                <div class="reminder-heading">

                    <i class="bi bi-calendar-heart"></i>

                    <h3>
                        Add Reminder
                    </h3>

                </div>

                <p>
                    Create a customer event reminder
                </p>

            </div>


            <button
                type="button"
                class="reminder-close"
                (click)="closeReminderForm()"
            >

                <i class="bi bi-x-lg"></i>

            </button>

        </div>


        <!-- SUCCESS -->

        <div
            class="reminder-success"
            *ngIf="reminderSaved"
        >

            <i class="bi bi-check-circle-fill"></i>

            Reminder saved successfully!

        </div>


        <!-- =================================
             FORM
        ================================== -->

        <form
            *ngIf="!reminderSaved"
            (ngSubmit)="saveReminder()"
        >


            <!-- REMINDER TYPE -->

            <div class="form-group">

                <label>
                    Reminder Type
                </label>


                <select
                    name="type"
                    [(ngModel)]="reminder.type"
                    required
                >

                    <option value="Birthday">
                        🎂 Birthday
                    </option>

                    <option value="Anniversary">
                        💍 Anniversary
                    </option>

                    <option value="Celebration">
                        🎉 Celebration
                    </option>

                    <option value="Special Booking">
                        🍽️ Special Booking
                    </option>

                    <option value="Custom">
                        📌 Custom
                    </option>

                </select>

            </div>


            <!-- CUSTOMER NAME -->

            <div class="form-group">

                <label>
                    Customer Name
                </label>


                <input
                    type="text"
                    name="customerName"
                    [(ngModel)]="reminder.customerName"
                    placeholder="Enter customer name"
                    required
                >

            </div>


            <!-- DATE + TIME -->

            <div class="form-row">


                <div class="form-group">

                    <label>
                        Date
                    </label>


                    <input
                        type="date"
                        name="date"
                        [(ngModel)]="reminder.date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Time
                    </label>


                    <input
                        type="time"
                        name="time"
                        [(ngModel)]="reminder.time"
                        required
                    >

                </div>

            </div>


            <!-- GUESTS + TABLE -->

            <div class="form-row">


                <div class="form-group">

                    <label>
                        Guests
                    </label>


                    <input
                        type="number"
                        name="guests"
                        [(ngModel)]="reminder.guests"
                        placeholder="12"
                        min="1"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Table
                    </label>


                    <select
                        name="tableNumber"
                        [(ngModel)]="reminder.tableNumber"
                    >

                        <option value="">
                            Select Table
                        </option>

                        <option value="T-01">
                            T-01
                        </option>

                        <option value="T-02">
                            T-02
                        </option>

                        <option value="T-03">
                            T-03
                        </option>

                        <option value="T-04">
                            T-04
                        </option>

                        <option value="T-05">
                            T-05
                        </option>

                        <option value="T-06">
                            T-06
                        </option>

                        <option value="T-07">
                            T-07
                        </option>

                        <option value="T-08">
                            T-08
                        </option>

                    </select>

                </div>

            </div>


            <!-- REMIND BEFORE -->

            <div class="form-group">

                <label>
                    Remind Me
                </label>


                <select
                    name="remindBefore"
                    [(ngModel)]="reminder.remindBefore"
                >

                    <option value="30 minutes">
                        30 minutes before
                    </option>

                    <option value="1 hour">
                        1 hour before
                    </option>

                    <option value="3 hours">
                        3 hours before
                    </option>

                    <option value="1 day">
                        1 day before
                    </option>

                </select>

            </div>


            <!-- NOTES -->

            <div class="form-group">

                <label>
                    Notes
                </label>


                <textarea
                    name="notes"
                    [(ngModel)]="reminder.notes"
                    placeholder="Cake, decoration, special request..."
                    rows="3"
                ></textarea>

            </div>


            <!-- ACTIONS -->

            <div class="reminder-actions">


                <button
                    type="button"
                    class="cancel-reminder"
                    (click)="closeReminderForm()"
                    [disabled]="savingReminder"
                >

                    Cancel

                </button>


                <button
                    type="submit"
                    class="save-reminder"
                    [disabled]="savingReminder"
                >

                    <i
                        class="bi"
                        [ngClass]="{
                            'bi-check-lg': !savingReminder,
                            'bi-arrow-repeat spin': savingReminder
                        }"
                    ></i>


                    {{
                        savingReminder
                            ? 'Saving...'
                            : 'Save Reminder'
                    }}

                </button>

            </div>

        </form>

    </div>

</div>
</header>
