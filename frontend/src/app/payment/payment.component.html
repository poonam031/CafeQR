<div class="upi-apps">

  <h3>Pay using UPI</h3>

  <!-- GOOGLE PAY -->
  <button
    type="button"
    class="upi-button gpay-button"
    (click)="payWithGooglePay()">

    <span class="upi-logo">G</span>

    <span>
      <strong>Google Pay</strong>
      <small>Pay with Google Pay</small>
    </span>

    <span>→</span>

  </button>


  <!-- PHONEPE -->
  <button
    type="button"
    class="upi-button phonepe-button"
    (click)="payWithPhonePe()">

    <span class="upi-logo">P</span>

    <span>
      <strong>PhonePe</strong>
      <small>Pay with PhonePe</small>
    </span>

    <span>→</span>

  </button>


  <!-- PAYTM -->
  <button
    type="button"
    class="upi-button paytm-button"
    (click)="payWithPaytm()">

    <span class="upi-logo">₹</span>

    <span>
      <strong>Paytm</strong>
      <small>Pay with Paytm</small>
    </span>

    <span>→</span>

  </button>

</div>
